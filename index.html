<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestre du Nouveau Monde – vidéo</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    color: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: normal;
    margin: 0 0 16px;
    text-align: center;
  }
  .video {
    width: 100%;
    max-width: 540px;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .video iframe {
    width: 100%;
    height: 760px;
    border: 0;
    display: block;
  }
  p.lien {
    margin-top: 16px;
    font-size: 0.9rem;
    text-align: center;
  }
  p.lien a { color: #3897f0; }
</style>
</head>
<body>
  <h1>Une vidéo de l'Orchestre du Nouveau Monde</h1>

  <div class="video">
    <iframe
      src="https://www.instagram.com/reel/DemMK4_Ml_r/embed/captioned/"
      allowtransparency="true"
      allow="encrypted-media; autoplay; fullscreen"
      allowfullscreen
      scrolling="no"
      title="Vidéo Instagram de l'Orchestre du Nouveau Monde"></iframe>
  </div>

  <p class="lien">
    Si la vidéo ne s'affiche pas, <a href="https://www.instagram.com/reel/DemMK4_Ml_r/" target="_blank" rel="noopener">l'ouvrir directement</a> (aucun compte nécessaire pour la regarder).
  </p>
</body>
</html>
